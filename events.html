<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الفعاليات</title>
<link rel="stylesheet" href="style.css">
<style>
.card {
  width:500px;
  border:2px solid #ccc;
  padding:20px;
  margin:15px;
  border-radius:15px;
  display:inline-block;
  vertical-align:top;
}
.card img, .card video, .card iframe {
  width:100%;
  max-height:400px;
  margin-top:10px;
  border-radius:10px;
}
.delete-btn {
  background:red;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>📅 الفعاليات</h1>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">اللائحة قوانين</a>
  <a href="talents.html">المواهب</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>فعاليات المدرسة</h2>
  <div id="eventsContent"></div>
</section>

<footer>
<p>© 2025 اكاديمية الإبداع</p>
</footer>

<script type="module">
import { db, watchAdmin, deleteData } from "./firebase.js";
import { collection, onSnapshot } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container = document.getElementById("eventsContent");
let isAdmin = false;

// مراقبة حالة الأدمن
watchAdmin(status => {
  isAdmin = status;
});

// رسم الفعاليات
function renderEvents(events) {
  container.innerHTML = "";

  if(events.length === 0) {
    container.innerHTML = "<p>لا توجد فعاليات حتى الآن.</p>";
    return;
  }

  events.forEach(e => {
    const card = document.createElement("div");
    card.className = "card";

    let media = "";
    if(e.image) {
      media = `<img src="${e.image}">`;
    } else if(e.video) {
      media = `<iframe src="${e.video}" height="300" allowfullscreen></iframe>`;
    }

    card.innerHTML = `
      <h3>${e.title}</h3>
      <p>${e.content}</p>
      ${media}
      ${isAdmin ? `<button class="delete-btn">🗑 حذف</button>` : ""}
    `;

    // زر الحذف للأدمن فقط
    if(isAdmin && card.querySelector(".delete-btn")) {
      card.querySelector(".delete-btn").onclick = async () => {
        if(confirm("هل تريد حذف هذه الفعالية؟")) {
          await deleteData("events", e.id);
        }
      };
    }

    container.appendChild(card);
  });
}

// مراقبة الفعاليات مباشرة من Firebase
const eventsCol = collection(db, "events");
onSnapshot(eventsCol, snapshot => {
  const data = snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  renderEvents(data);
});
</script>

</body>
</html>
