<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قوانين شؤون الطلبة</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: Tahoma, sans-serif; margin:0; padding:0; }
  .rules-container { 
    display:flex; 
    flex-wrap:wrap; 
    gap:20px; 
    margin-top:20px; 
    justify-content:center; 
  }
  .rule-card { 
    border:1px solid #ccc; 
    border-radius:8px; 
    padding:10px; 
    width:80%; /* bigger width */
    max-width:800px; /* limit max width for large screens */
    text-align:center; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .rule-card img { 
    width:100%; 
    height:auto; 
    border-radius:5px; 
  }
</style>
</head>
<body>

<header>
  <img src="assets/logo2.png" alt="Left Logo" class="logo-left">
  <img src="assets/logo1.png" alt="Right Logo" class="logo-right">
  <h1>📜 قوانين شؤون الطلبة</h1>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="talents.html">المواهب</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="library.html">الفعاليات</a>
  <a href="achievements.html">إنجازات المدرسة</a>
</nav>

<section>
  <h2>اللائحة المدرسية</h2>

  <div class="rules-container" id="rulesContainer"></div>
</section>

<footer>
  <p>© 2025 بوابة الإبداع</p>
</footer>

<script>
// Example rules images (add/remove by code)
const rules = [
  { image: "assets/rule1.JPG", alt: "Rule 1" }
];

// Display rules
const rulesContainer = document.getElementById("rulesContainer");
rules.forEach(rule => {
  const card = document.createElement("div");
  card.className = "rule-card";
  card.innerHTML = `<img src="${rule.image}" alt="${rule.alt}">`;
  rulesContainer.appendChild(card);
});
</script>

</body>
</html>
