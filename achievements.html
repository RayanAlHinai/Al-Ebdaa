<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنجازات المدرسة</title>
<link rel="stylesheet" href="style.css">
<style>
#achievementsContent { display:flex; flex-wrap:wrap; gap:15px; }
.card { width:220px; border:1px solid #ccc; padding:10px; border-radius:8px; }
.card img, .card video { width:100%; margin-top:8px; border-radius:6px; }
</style>
</head>
<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>🏆 إنجازات المدرسة</h1>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="talents.html">المواهب</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">قوانين اللائحة</a>
  <a href="library.html">االفعاليات</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>نجاحاتنا</h2>
  <div id="achievementsContent"></div>
</section>

<footer>
<p>© 2025 بوابة الإبداع</p>
</footer>

<script type="module">
import { db, watchAdmin, deleteData } from "./firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container = document.getElementById("achievementsContent");
let isAdmin = false;

// مراقبة حالة الأدمن
watchAdmin(status => {
  isAdmin = status;
});

// رسم الإنجازات
function renderAchievements(data) {
  container.innerHTML = "";
  if(data.length === 0) {
    container.innerHTML = "<p>لا توجد إنجازات حتى الآن.</p>";
    return;
  }

  data.forEach(a => {
    const div = document.createElement("div");
    div.className = "card";

    let media = "";
    if(a.image) media = `<img src="${a.image}">`;
    else if(a.video) media = `<iframe src="${a.video}" width="100%" height="300" allowfullscreen></iframe>`;

    div.innerHTML = `
      <strong>${a.title}</strong>
      <p>${a.content}</p>
      ${media}
      ${isAdmin ? `<button class="delete-btn">🗑 حذف</button>` : ""}
    `;

    if(isAdmin && div.querySelector(".delete-btn")) {
      div.querySelector(".delete-btn").onclick = async () => {
        if(confirm("هل تريد الحذف؟")) {
          await deleteData("achievements", a.id);
        }
      };
    }

    container.appendChild(div);
  });
}

// مراقبة الإنجازات مباشرة
const achievementsCol = collection(db, "achievements");
onSnapshot(achievementsCol, snapshot => {
  const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderAchievements(data);
});
</script>
</body>
</html>
