<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المواهب</title>
<link rel="stylesheet" href="style.css">
<style>
.card {
  width:500px;
  border:2px solid #ccc;
  padding:20px;
  margin:15px;
  border-radius:15px;
  display:inline-block;
  vertical-align:top;
}
.card img, .card video {
  width:100%;
  max-height:400px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>
<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>🌟 المواهب</h1>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">اللائحة قوانين </a>
  <a href="library.html">الفعاليات</a>
  <a href="achievements.html">الإنجازات</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>عرض مواهب الطلبة</h2>
  <div id="talentsContent"></div>
</section>

<footer>
<p>© 2025 اكاديمية الإبداع</p>
</footer>

<script type="module">
import { db, watchAdmin, deleteData } from "./firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container = document.getElementById("talentsContent");
let isAdmin = false;

// مراقبة حالة الأدمن
watchAdmin(status => {
  isAdmin = status;
});

// رسم المواهب
function renderTalents(talents) {
  container.innerHTML = "";
  if(talents.length === 0) {
    container.innerHTML = "<p>لا توجد مواهب حتى الآن.</p>";
    return;
  }

  talents.forEach(t => {
    const card = document.createElement("div");
    card.className = "card";

    let media = "";
    if(t.image) media = `<img src="${t.image}">`;
    else if(t.video) media = `<iframe src="${t.video}" width="100%" height="300" allowfullscreen></iframe>`;

    card.innerHTML = `
      <h3>${t.title}</h3>
      <p>${t.content}</p>
      ${media}
      ${isAdmin ? `<button class="delete-btn">🗑 حذف</button>` : ""}
    `;

    if(isAdmin && card.querySelector(".delete-btn")) {
      card.querySelector(".delete-btn").onclick = async () => {
        if(confirm("هل تريد الحذف؟")) {
          await deleteData("talents", t.id);
        }
      };
    }

    container.appendChild(card);
  });
}

// مراقبة المواهب مباشرة
const talentsCol = collection(db, "talents");
onSnapshot(talentsCol, snapshot => {
  const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderTalents(data);
});
</script>
</body>
</html>
