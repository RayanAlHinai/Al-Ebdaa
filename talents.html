<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المواهب</title>
<link rel="stylesheet" href="style.css">
<style>
.card {
  width:500px;
  border:2px solid #ccc;
  padding:20px;
  margin:15px;
  border-radius:15px;
  display:inline-block;
  vertical-align:top;
}
.card img, .card video {
  width:100%;
  max-height:400px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>🌟 المواهب</h1>
</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">قوانين اللائحة</a>
  <a href="library.html">المكتبة الإلكترونية</a>
  <a href="achievements.html">الإنجازات</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>عرض مواهب الطلبة</h2>
  <div id="talentsContent"></div>
</section>

<footer>
<p>© 2025 بوابة الإبداع</p>
</footer>

<script type="module">
import { getCollectionData } from "./firebase.js";

const container = document.getElementById("talentsContent");
const talents = await getCollectionData("talents");

talents.forEach(t => {
  const card = document.createElement("div");
  card.className = "card";

  let media = "";
  if(t.image) media = `<img src="${t.image}">`;
  else if(t.video) media = `<video controls src="${t.video}"></video>`;

  card.innerHTML = `<h3>${t.title}</h3><p>${t.content}</p>${media}`;
  container.appendChild(card);
});
</script>

</body>
</html>
