<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>
<style>
body{font-family:Tahoma;padding:20px}
.card{border:1px solid #ccc;padding:10px;margin:10px 0}
iframe,img{width:100%;max-height:300px}
button{margin-top:5px}
</style>
</head>
<body>

<h1>لوحة الإدارة</h1>
<button onclick="location.href='index.html'">الرئيسية</button>

<h2>إضافة محتوى</h2>
<input id="title" placeholder="العنوان">
<textarea id="content" placeholder="المحتوى"></textarea>
<input id="media" placeholder="رابط صورة أو فيديو">
<select id="type">
<option value="news">الأخبار</option>
<option value="talents">المواهب</option>
<option value="achievements">الإنجازات</option>
</select>
<button id="addBtn">إضافة</button>
<p id="msg"></p>

<h2>إدارة المحتوى</h2>
<div id="container"></div>

<script type="module">
import {
  db, addData, deleteData, watchAdmin, normalizeVideoLink
} from "./firebase.js";
import { collection, onSnapshot } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

watchAdmin(isAdmin=>{
  if(!isAdmin) location.href="admin-login.html";
});

addBtn.onclick = async () => {
  const link = media.value.trim();
  const video = normalizeVideoLink(link);

  await addData(type.value,{
    title:title.value,
    content:content.value,
    image: link.match(/\.(jpg|png|jpeg)$/i) ? link : "",
    video: video.includes("preview") || video.includes("embed") ? video : ""
  });

  title.value=content.value=media.value="";
  msg.textContent="تمت الإضافة ✅";
};

["news","talents","achievements"].forEach(col=>{
  onSnapshot(collection(db,col), snap=>{
    render(col, snap.docs.map(d=>({id:d.id,...d.data()})));
  });
});

function render(col, items){
  container.innerHTML += `<h3>${col}</h3>`;
  items.forEach(i=>{
    container.innerHTML += `
      <div class="card">
        <strong>${i.title}</strong>
        <p>${i.content}</p>
        ${i.image?`<img src="${i.image}">`:""}
        ${i.video?`<iframe src="${i.video}" allowfullscreen></iframe>`:""}
        <button onclick="del('${col}','${i.id}')">🗑 حذف</button>
      </div>`;
  });
}

window.del = async (c,id)=>{
  if(confirm("حذف؟")) await deleteData(c,id);
};
</script>

</body>
</html>
