<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الإدارة</title>

<style>
body{
  font-family:Tahoma;
  padding:20px;
  background:#f4f4f4;
}

input,textarea,select,button{
  width:100%;
  margin:6px 0;
  padding:8px;
}

button{
  cursor:pointer;
}

.card{
  border:1px solid #ccc;
  padding:10px;
  margin:10px 0;
  background:#fff;
  border-radius:8px;
}

img,iframe{
  width:100%;
  max-height:300px;
  margin-top:8px;
  border-radius:6px;
}

.delete{
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:5px;
  padding:6px;
  margin-top:6px;
}

h3{
  margin-top:30px;
}
</style>
</head>

<body>

<h1>لوحة الإدارة المتكاملة</h1>
<button onclick="location.href='index.html'">العودة للرئيسية</button>

<hr>

<h2>➕ إضافة محتوى</h2>

<input id="title" placeholder="العنوان">
<textarea id="content" placeholder="المحتوى"></textarea>
<input id="media" placeholder="رابط صورة أو فيديو (Drive / YouTube)">

<select id="type">
  <option value="news">الأخبار</option>
  <option value="talents">المواهب</option>
  <option value="events">الفعاليات</option>
  <option value="parents">همسات ولي الأمر</option>
  <option value="rules">القوانين</option>
</select>

<button id="addBtn">إضافة</button>
<p id="msg" style="color:green"></p>

<hr>

<h2>📂 إدارة المحتوى</h2>
<div id="container"></div>

<!-- Firebase -->
<script type="module">
import {
  db,
  addData,
  deleteData,
  watchAdmin,
  normalizeVideoLink
} from "./firebase.js";

import { collection, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔐 حماية الأدمن */
watchAdmin(isAdmin=>{
  if(!isAdmin) location.href="admin-login.html";
});

/* ➕ إضافة محتوى */
addBtn.onclick = async () => {
  const link = media.value.trim();
  const video = normalizeVideoLink(link);

  await addData(type.value,{
    title: title.value,
    content: content.value,
    image: link.match(/\.(jpg|jpeg|png)$/i) ? link : "",
    video: video.includes("preview") || video.includes("embed") ? video : ""
  });

  title.value="";
  content.value="";
  media.value="";
  msg.textContent="تمت الإضافة بنجاح ✅";
};

/* 🖥️ عرض المحتوى */
const sections = [
  "news",
  "talents",
  "events",
  "parents",
  "rules"
];

sections.forEach(col=>{
  onSnapshot(collection(db,col), snap=>{
    render(col, snap.docs.map(d=>({id:d.id,...d.data()})));
  });
});

function render(col, items){
  const secId = "sec-"+col;
  let sec = document.getElementById(secId);

  if(!sec){
    sec = document.createElement("div");
    sec.id = secId;
    container.appendChild(sec);
  }

  sec.innerHTML = `<h3>${getTitle(col)}</h3>`;

  if(items.length===0){
    sec.innerHTML += `<p>لا يوجد محتوى</p>`;
    return;
  }

  items.forEach(i=>{
    sec.innerHTML += `
      <div class="card">
        <strong>${i.title||""}</strong>
        <p>${i.content||""}</p>
        ${i.image?`<img src="${i.image}">`:""}
        ${i.video?`<iframe src="${i.video}" allowfullscreen></iframe>`:""}
        <button class="delete" onclick="del('${col}','${i.id}')">🗑 حذف</button>
      </div>
    `;
  });
}

/* 🗑 حذف */
window.del = async (c,id)=>{
  if(confirm("هل تريد الحذف؟")){
    await deleteData(c,id);
  }
};

/* 🏷️ أسماء الأقسام */
function getTitle(c){
  return {
    news:"📰 الأخبار",
    talents:"🌟 المواهب",
    events:"📅 الفعاليات",
    parents:"👨‍👩‍👧 همسات ولي الأمر",
    rules:"📜 القوانين"
  }[c];
}
</script>

</body>
</html>
