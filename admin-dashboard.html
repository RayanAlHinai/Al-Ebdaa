<body>
<h2>لوحة تحكم الإدارة</h2>

<input id="title" placeholder="العنوان"><br><br>
<textarea id="content" placeholder="المحتوى"></textarea><br><br>
<input id="media" placeholder="رابط الصورة أو الفيديو"><br><br>

<select id="type">
  <option value="news">الأخبار</option>
  <option value="talents">المواهب</option>
  <option value="achievements">الإنجازات</option>
</select><br><br>

<button onclick="add()">إضافة</button>
<button onclick="goHome()">الرجوع للرئيسية</button>

<p id="msg"></p>

<script type="module">
import { addData } from "./firebase.js";

window.add = async () => {
  const link = media.value.trim();

  await addData(type.value, {
    title: title.value,
    content: content.value,
    image: link.match(/\.(jpg|png|jpeg)$/i) ? link : "",
    video: link.includes("youtube") || link.endsWith(".mp4") ? link : ""
  });

  msg.textContent = "تمت الإضافة ✅";
  // إعادة فراغ الحقول
  title.value = "";
  content.value = "";
  media.value = "";
};

window.goHome = () => {
  location.href = "index.html";
};
</script>
