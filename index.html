<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بوابة الإبداع</title>
<link rel="stylesheet" href="style.css">
<style>
.news-slider { display:flex; flex-wrap:wrap; gap:15px; }
.news-card { width:220px; border:1px solid #ccc; padding:10px; border-radius:8px; }
.news-card img, .news-card video { width:100%; margin-bottom:8px; }
</style>
</head>

<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>بوابة الإبداع</h1>
  <p>منصة المدرسة لعرض المواهب والإنجازات</p>
</header>

<nav>
  <a href="talents.html">المواهب</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">قوانين اللائحة</a>
  <a href="library.html">المكتبة الإلكترونية</a>
  <a href="achievements.html">الإنجازات</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>📰 الأخبار</h2>
  <div id="newsContainer" class="news-slider"></div>
</section>

<footer>
<p>© 2025 بوابة الإبداع</p>
</footer>

<script type="module">
import { getCollectionData } from "./firebase.js";

const container = document.getElementById("newsContainer");
const news = await getCollectionData("news");

news.forEach(n => {
  const card = document.createElement("div");
  card.className = "news-card";

  let media = "";
  if(n.image) media = `<img src="${n.image}">`;
  else if(n.video) media = `<video controls src="${n.video}"></video>`;

  card.innerHTML = `${media}<h3>${n.title}</h3><p>${n.content}</p>`;
  container.appendChild(card);
});
</script>

</body>
</html>
