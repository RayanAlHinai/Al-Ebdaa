<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اكاديمية الإبداع</title>
<link rel="stylesheet" href="style.css">
<style>
.news-slider { display:flex; flex-wrap:wrap; gap:15px; }
.news-card { width:220px; border:1px solid #ccc; padding:10px; border-radius:8px; }
.news-card img, .news-card video { width:100%; margin-bottom:8px; }
</style>
</head>
<body>

<header>
  <img src="assets/logo2.png" class="logo-left">
  <img src="assets/logo1.png" class="logo-right">
  <h1>اكاديمية الإبداع</h1>
  <p>منصة المدرسة لعرض المواهب والإنجازات</p>
</header>

<nav>
  <a href="talents.html">المواهب</a>
  <a href="parents.html">همسات لولي الأمر</a>
  <a href="rules.html">اللائحة قوانين </a>
  <a href="library.html">االفعاليات</a>
  <a href="achievements.html">الإنجازات</a>
  <a href="admin-login.html" class="admin-btn">تسجيل دخول</a>
</nav>

<section>
  <h2>📰 الأخبار</h2>
  <div id="newsContainer" class="news-slider"></div>
</section>

<footer>
<p>© 2025 اكاديمية الإبداع</p>
</footer>

<script type="module">
import { db, watchAdmin, deleteData } from "./firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container = document.getElementById("newsContainer");
let isAdmin = false;

// مراقبة حالة الأدمن
watchAdmin(status => {
  isAdmin = status;
});

// رسم الأخبار
function renderNews(news) {
  container.innerHTML = "";
  if(news.length === 0) {
    container.innerHTML = "<p>لا توجد أخبار حتى الآن.</p>";
    return;
  }

  news.forEach(n => {
    const card = document.createElement("div");
    card.className = "news-card";

    let media = "";
    if(n.image) media = `<img src="${n.image}">`;
    else if(n.video) media = `<iframe src="${n.video}" width="100%" height="300" allowfullscreen></iframe>`;

    card.innerHTML = `
      <h3>${n.title}</h3>
      <p>${n.content}</p>
      ${media}
      ${isAdmin ? `<button class="delete-btn">🗑 حذف</button>` : ""}
    `;

    if(isAdmin && card.querySelector(".delete-btn")) {
      card.querySelector(".delete-btn").onclick = async () => {
        if(confirm("هل تريد الحذف؟")) {
          await deleteData("news", n.id);
        }
      };
    }

    container.appendChild(card);
  });
}

// مراقبة الأخبار مباشرة
const newsCol = collection(db, "news");
onSnapshot(newsCol, snapshot => {
  const newsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderNews(newsData);
});
</script>
</body>
</html>
